<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FAF7F2" />
    <meta
      name="description"
      content="PetLog — შენი მეგობრის ჯანმრთელობა, ბედნიერი მოგონებები და ყოველდღიური თავგადასავლები ერთ პირად სივრცეში."
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%petlog-mark.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%app-logo.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>PetLog — მეტი ბედნიერი დღე, ერთად.</title>
    <style>
      .petlog-startup {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #faf7f2;
        color: #78716c;
        font:
          14px/1.9 "Noto Sans Georgian",
          sans-serif;
        text-align: center;
      }
      .petlog-startup > div {
        max-width: 420px;
      }
      .petlog-startup h1 {
        color: #1b4332;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 34px;
        letter-spacing: -2px;
      }
      .petlog-startup p {
        margin: 18px 0;
      }
      .petlog-startup button {
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        background: #1b4332;
        color: white;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="petlog-startup">
        <div>
          <h1>petlog.</h1>
          <p id="startup-status" role="status">შენი პირადი სივრცე იტვირთება…</p>
          <button id="startup-retry" type="button" hidden>თავიდან ცდა</button
          ><noscript>PetLog-ის გასახსნელად საჭიროა JavaScript.</noscript>
        </div>
      </main>
    </div>
    <script>
      document
        .getElementById("startup-retry")
        .addEventListener("click", function () {
          location.reload();
        });
      setTimeout(function () {
        var status = document.getElementById("startup-status");
        if (status) {
          status.textContent =
            "აპი ვერ ჩაიტვირთა. გადაამოწმე ინტერნეტი და განაახლე გვერდი.";
          status.setAttribute("role", "alert");
          document.getElementById("startup-retry").hidden = false;
        }
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
